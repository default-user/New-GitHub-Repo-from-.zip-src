[package]
name = "zip2repo"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.39", features = ["rt-multi-thread", "macros"] }
zip = "2"
walkdir = "2"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.20"
octocrab = "0.39"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"
sha2 = "0.10"
bytes = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
